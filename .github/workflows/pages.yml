name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: nsc-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NSC_EXPERIENCE_OUTPUT: ${{ runner.temp }}/nsc-experience/experience.json
      NSC_EXPERIENCE_SCREENSHOTS_DIR: ${{ runner.temp }}/nsc-experience/screenshots
      NSC_LAYOUT_SCREENSHOTS_DIR: ${{ runner.temp }}/nsc-layout/screenshots
      NSC_CHECK_TIMINGS: ${{ runner.temp }}/nsc-assurance/check-timings.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-audit.txt
      - name: Bootstrap pinned audit environment
        run: python3 scripts/bootstrap_audit_env.py
      - name: Configure Pages base URL
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build and run canonical public-release gates
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/run_all_checks.py
      - name: Archive exact audited Pages tree
        if: ${{ github.event.repository.private == false }}
        run: tar --dereference --hard-dereference --directory public -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload exact audited Pages tree
        if: ${{ github.event.repository.private == false }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.event.repository.private == false }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact audited tree
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

