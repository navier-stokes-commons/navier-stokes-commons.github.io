name: Reconcile public forge intake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsc-derived-state
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Fetch GitHub and GitLab public collaboration surfaces
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_forge_intake.py
      - name: Validate derived intake
        run: python3 scripts/audit_r14_intake.py
      - name: Publish changed derived intake only
        run: |
          if git diff --quiet -- content/public/intake.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/public/intake.json
          git commit -m "Update derived public forge intake"
          git push origin HEAD:main
