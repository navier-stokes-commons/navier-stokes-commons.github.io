name: Watch registered research sources

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsc-derived-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Observe registered sources without changing claim status
        run: python3 scripts/watch_sources.py
      - name: Validate source-watch authority boundary
        run: python3 scripts/audit_r14_source_watch.py
      - name: Fold source deltas into the shared public intake queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_forge_intake.py
          python3 scripts/audit_r14_intake.py
      - name: Publish only new source observations/deltas and derived intake
        run: |
          if git diff --quiet -- content/public/source_watch.json content/public/intake.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/public/source_watch.json content/public/intake.json
          git commit -m "Record public source-watch delta"
          git push origin HEAD:main
