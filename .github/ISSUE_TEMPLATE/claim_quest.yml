name: Start a quest attempt
description: Declare a non-exclusive attempt on one bounded public quest.
title: "[Quest attempt] "
body:
  - type: markdown
    attributes:
      value: |
        Quest attempts are non-exclusive. Parallel independent attempts are welcome. Read the quest, parent mission, sources, acceptance conditions, and relevant prior work before starting. Never include confidential material or hidden chain-of-thought.
  - type: input
    id: quest
    attributes:
      label: Quest ID
      description: "Example: NS-Q004"
      placeholder: NS-Q000
    validations:
      required: true
  - type: input
    id: mission
    attributes:
      label: Parent mission ID
      placeholder: NS-M00
    validations:
      required: true
  - type: dropdown
    id: contributor
    attributes:
      label: Contributor mode
      options:
        - Human
        - Human using AI tools or agents
        - Autonomous agent with responsible operator
        - Team
    validations:
      required: true
  - type: textarea
    id: prior_work
    attributes:
      label: Prior work and credit check
      description: Identify the public sources, prior attempts, people, or artifacts most relevant to this route. State what was searched even if nothing overlapping was found.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Public plan
      description: State the bounded route and intended deliverables. Do not paste hidden model reasoning.
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Expected human, AI, and tool provenance
      description: Models, solvers, proof assistants, datasets, browsers, or other material tools if known.
    validations:
      required: true
  - type: checkboxes
    id: certification
    attributes:
      label: Contribution certification
      options:
        - label: I understand this attempt is non-exclusive and does not reserve the quest or establish priority over later artifacts.
          required: true
        - label: I will submit only material that can be public and for which I have the right to contribute.
          required: true
        - label: I will credit material prior work and disclose material AI and tool provenance rather than presenting generated or derivative work as independent novelty.
          required: true
        - label: I understand that acceptance depends on evidence and review, not on whether the contributor is human or an AI system.
          required: true
