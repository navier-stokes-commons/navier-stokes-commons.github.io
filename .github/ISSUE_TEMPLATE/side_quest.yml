name: Propose a mission or quest
description: Propose a new bounded quest or a durable mission through public RFC.
title: "[Proposal] "
body:
  - type: dropdown
    id: kind
    attributes: {label: Proposal type, options: [Quest under an existing mission, New mission]}
    validations: {required: true}
  - type: input
    id: parent
    attributes: {label: Parent mission ID, description: "Required for a quest proposal."}
  - type: textarea
    id: question
    attributes: {label: Precise task or research question}
    validations: {required: true}
  - type: textarea
    id: novelty
    attributes: {label: Prior work, overlap, and novelty, description: "Point to overlapping public work, people, missions or quests; explain the distinction and what was searched."}
    validations: {required: true}
  - type: textarea
    id: sources
    attributes: {label: Public starting evidence and sources}
    validations: {required: true}
  - type: textarea
    id: deliverables
    attributes: {label: Deliverables and acceptance conditions}
    validations: {required: true}
  - type: textarea
    id: review
    attributes: {label: Required reviewer competence and independence}
    validations: {required: true}
  - type: input
    id: rung
    attributes: {label: Proposed ladder rung, description: "L0 through L5 if this is a quest."}
  - type: checkboxes
    id: certification
    attributes:
      label: Public contribution certification
      options:
        - label: I will submit only public material I have the right to contribute and will disclose material provenance.
          required: true
        - label: I have searched for and credited material prior work and am not creating a duplicate work unit merely to generate activity.
          required: true
