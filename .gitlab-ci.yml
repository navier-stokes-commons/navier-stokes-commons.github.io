stages:
  - test
  - deploy

default:
  image: python:3.12-slim
  before_script:
    - python3 scripts/bootstrap_audit_env.py

public-audit:
  stage: test
  interruptible: true
  variables:
    NSC_AUDIT_SCRATCH: $HOME/nsc-audit-scratch
    
    
    
  script:
    # Build host-specific actions/canonical/sitemap once, audit that exact tree,
    # then hand the proven public/ artifact to the Pages job unchanged.
    - SITE_URL="$CI_PAGES_URL" python3 scripts/run_all_checks.py
  after_script:
    - mkdir -p audit/runtime
    - if [ -d "$NSC_AUDIT_SCRATCH/nsc-experience-audit" ]; then cp -a "$NSC_AUDIT_SCRATCH/nsc-experience-audit" audit/runtime/experience; fi
    - if [ -d "$NSC_AUDIT_SCRATCH/nsc-layout-integrity" ]; then cp -a "$NSC_AUDIT_SCRATCH/nsc-layout-integrity" audit/runtime/layout; fi
    - if [ -d "$NSC_AUDIT_SCRATCH/nsc-check-timings" ]; then cp -a "$NSC_AUDIT_SCRATCH/nsc-check-timings" audit/runtime/assurance; fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - audit/runtime/
      - public/

deploy-pages:
  stage: deploy
  resource_group: pages
  needs:
    - job: public-audit
      artifacts: true
  before_script: []
  script:
    - test -f public/index.html
    - test -f public/openapi.json
    - test -f public/sitemap.xml
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
