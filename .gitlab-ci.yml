stages:
  - test
  - deploy

default:
  image: python:3.12-slim
  before_script:
    - python3 scripts/bootstrap_audit_env.py

public-audit:
  stage: test
  script:
    - python3 scripts/run_all_checks.py

deploy-pages:
  stage: deploy
  script:
    - SITE_URL="$CI_PAGES_URL" python3 scripts/run_all_checks.py
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
